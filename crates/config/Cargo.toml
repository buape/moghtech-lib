[package]
name = "mogh_config"
description = "Utilities to merge config from multiple files / directories."
version = "3.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Load config from Cicada with `cicada:` paths. Opt in: it brings the
# cicada client (and with it an http / auth client stack) into the build.
cicada = ["dep:cicada_loader"]

[dependencies]
cicada_loader = { workspace = true, optional = true }
serde_yaml_ng.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
indexmap.workspace = true
wildcard.workspace = true
colored.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true