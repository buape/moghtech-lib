[package]
name = "mogh_server"
description = "Configurable axum server including TLS, Session, CORS, common security headers, and static file hosting."
version = "2.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# `openapi::serve_docs`: the Scalar API reference over a cached spec.
openapi = ["dep:serde", "dep:serde_json", "dep:flate2"]

[dependencies]
mogh_request_ip.workspace = true
tower-sessions.workspace = true
data-encoding.workspace = true
axum-server.workspace = true
tower-http.workspace = true
tracing.workspace = true
anyhow.workspace = true
axum.workspace = true
sha2.workspace = true
url.workspace = true
tokio.workspace = true
# The `openapi` feature.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
# Implements tower-sessions' SessionStore trait.
async-trait.workspace = true
# Used to pick the crypto provider (see 'serve_app').
rustls.workspace = true
# The timer hyper needs to apply the header read timeout (see
# 'serve_app').
hyper-util.workspace = true

[dev-dependencies]
tower.workspace = true
# An http/2 client for the header read timeout tests.
h2.workspace = true
reqwest.workspace = true
# 'ring' next to aws-lc-rs, as in apps also using mogh_auth_server,
# so rustls can't pick a crypto provider by itself.
rustls = { workspace = true, features = ["ring"] }