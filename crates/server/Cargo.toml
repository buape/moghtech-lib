[package]
name = "mogh_server"
description = "Configurable axum server including TLS, Session, CORS, common security headers, and static file hosting."
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mogh_request_ip.workspace = true
tower-sessions.workspace = true
data-encoding.workspace = true
axum-server.workspace = true
tower-http.workspace = true
tracing.workspace = true
anyhow.workspace = true
axum.workspace = true
sha2.workspace = true
url.workspace = true
# Implements tower-sessions' SessionStore trait.
async-trait = "0.1.89"
# Same version / features as axum-server 'tls-rustls', used to pick
# the crypto provider (see 'serve_app').
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio.workspace = true
reqwest.workspace = true
# 'ring' next to aws-lc-rs, as in apps also using mogh_auth_server,
# so rustls can't pick a crypto provider by itself.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std"] }